<!DOCTYPE html>
<html>
<head>
    <title>Мои поля</title>
    <link rel="stylesheet" href="/static/style/farmer.css">
    <style>
        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .field-card {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }
        .field-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мои поля</h1>
        <a href="/pages/add_field" class="submit-button">Добавить новое поле</a>

        <div class="fields-grid">
            {% for field in fields %}
            <div class="field-card">
                <h3>{{ field.name }}</h3>
                <p><strong>Площадь:</strong> {{ field.area_hectares | round(2) }} га</p>
                <p><strong>Тип почвы:</strong> {{ field.cultivation_technology }}</p>
                <p><strong>Севооборот:</strong> {{ field.crop_rotation }}</p>
                <div class="field-actions">
                    <button class="submit-button" onclick="window.location='/fields/{{ field.id }}'">Подробнее</button>
                    <button class="submit-button" style="background: #dc3545"
                            onclick="deleteField({{ field.id }})">Удалить</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
    async function deleteField(fieldId) {
        if (!confirm('Вы уверены что хотите удалить поле?')) return;

        try {
            const response = await fetch(`/fields/${fieldId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${getCookie('users_access_token')}`
                }
            });

            if (response.ok) {
                window.location.reload();
            } else {
                alert('Ошибка удаления поля');
            }
        } catch (error) {
            alert('Ошибка соединения');
        }
    }
    </script>
</body>
</html>
